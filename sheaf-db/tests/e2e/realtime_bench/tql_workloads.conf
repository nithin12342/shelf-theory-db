# TQL seven-database workload inputs.
# The binary reads this file with --config <path>. The default path is
# tests/e2e/realtime_bench/tql_workloads.conf from the sheaf-db directory.
#
# Cost model. The values are relative units, not wall-clock times.
cost.io_cost_per_row=1.0
cost.cpu_cost_per_row=0.1
cost.probe_cost_per_slice=0.5
cost.solve_cost_per_dim=2.0
#
# Workload cases. case.count is the number of cases. Each case has a name,
# a target engine, a query, a row count, a boundary degree, a stalk dimension,
# and one ndv.<field> line per distinct-value estimate.
case.count=4

case.1.name=IMDb Join Order Benchmark (JOB Q4)
case.1.target=DuckDB / PostgreSQL / MariaDB
case.1.query=MATCH HYPERCELL c: Casting OVER (t: Title, p: Person) WHERE t.year > 2000 AND t.rating > 75 SOLVE HARMONIC (REGULARIZATION: 0.01, MAX_ITERATIONS: 25, ENERGY_THRESHOLD: 0.005) EMIT SECTION { p.name, t.rating, SECTION_ENERGY };
case.1.total_rows=100000
case.1.avg_boundary_degree=2
case.1.stalk_dim=4
case.1.ndv.year=100
case.1.ndv.rating=50

case.2.name=Fraud Network 2-Hop Traversal
case.2.target=Neo4j (Graph traversal)
case.2.query=MATCH HYPERCELL t: Payment OVER (a: Account, m: Merchant, c: Country) WHERE a.balance > 1000 AND t.risk == 1 SOLVE HARMONIC (REGULARIZATION: 0.01, MAX_ITERATIONS: 25, ENERGY_THRESHOLD: 0.005) EMIT SECTION { a.acct_id, m.category, SECTION_ENERGY };
case.2.total_rows=50000
case.2.avg_boundary_degree=3
case.2.stalk_dim=4
case.2.ndv.category=25
case.2.ndv.risk=2

case.3.name=TPC-H SF1 Analytical Filter & Aggregation
case.3.target=DuckDB / SQLite (Columnar / OLAP)
case.3.query=MATCH HYPERCELL l: LineItem OVER (o: Order, p: PartSupp) WHERE l.shipdate < 19980902 SOLVE HARMONIC (REGULARIZATION: 0.01, MAX_ITERATIONS: 25, ENERGY_THRESHOLD: 0.005) EMIT SECTION { l.line_id, l.quantity, SECTION_ENERGY };
case.3.total_rows=600000
case.3.avg_boundary_degree=2
case.3.stalk_dim=4
case.3.ndv.shipdate=2526

case.4.name=Key-Value Direct Point Lookup
case.4.target=Redis / ScyllaDB (Key-Value)
case.4.query=MATCH HYPERCELL t: Payment OVER (a: Account) WHERE a.acct_id == 1001 SOLVE HARMONIC (REGULARIZATION: 0.01, MAX_ITERATIONS: 25, ENERGY_THRESHOLD: 0.005) EMIT SECTION { a.acct_id, SECTION_ENERGY };
case.4.total_rows=10000
case.4.avg_boundary_degree=1
case.4.stalk_dim=4
case.4.ndv.acct_id=10000
